<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAFAFA"/>
  <!-- Decorative gradient blobs -->
  <ellipse cx="150" cy="150" rx="200" ry="150" fill="#E0F2F1" opacity="0.5"/>
  <ellipse cx="1050" cy="480" rx="250" ry="180" fill="#FFF3E0" opacity="0.5"/>

  <!-- Logo -->
  <g transform="translate(600, 200)">
    <rect x="-80" y="-80" width="160" height="160" rx="24" fill="#007B83"/>
    <path d="M-40 0L0 50L80 -30" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#212121">VR INTERIORS</text>

  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#616161">AS WE evolve our home should too</text>

  <!-- Subtitle -->
  <text x="600" y="500" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#757575">Interior Design • Premium Materials • Vizag</text>

  <!-- Bottom accent -->
  <line x1="450" y1="540" x2="750" y2="540" stroke="#007B83" stroke-width="4" stroke-linecap="round"/>
  <line x1="450" y1="540" x2="750" y2="540" stroke="#E86C00" stroke-width="2" stroke-linecap="round" stroke-dasharray="20,10"/>
</svg>